crons:
  - name: inventory-plans
    description: "Opens scheduled inventories and sends inventory reminders every morning (Abidjan)"
    cron: "0 7 * * *"
    timezone: "Africa/Abidjan"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/inventories"
    method: POST
    enabled: true
